services:
  - type: web
    name: kindred-api
    runtime: node
    rootDir: .
    buildCommand: pnpm install --prod=false && pnpm --filter api build && pnpm --filter api exec prisma migrate deploy
    startCommand: pnpm --filter api start
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: kindred-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: CORS_ORIGIN
        value: https://web-madiha-maha.vercel.app

databases:
  - name: kindred-db
    databaseName: kindred
    user: kindred